<style>

body {

 .btn {
    display: inline-flex;

    font-weight: 500;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background-color: red;
    color: white;
    transition: background-color 0.2s ease;
    
}
 .btn-medium {

 }

        }
        a:active {
            color: red
}
  .padded-button {

  } 

</style>
