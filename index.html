<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, inital-scale=0.5";>
    <title>Recipe Book</title>
    </head>

    <style>
        a:link {
            color: rgb(255,255,255)
        }
        a:visited {
            color: rgb(0, 0, 0)
        }
        a:hover {
            color: rgb(114,5,148)
        }
        a:active {
            color: red
        }
            body {
        /*  background-image: url();  */
            background-color: black;
            background-repeat: no repeat;
            background-size: cover;
            background-attachment: fixed;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
                .large-btn-padding {
            font-size: 20px;       /* Enlarges the text inside */
            padding: 15px 30px;    /* 15px top/bottom space, 30px left/right space */
            cursor: pointer;       /* Changes the mouse cursor to a pointer on hover */
        }
                .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            font-weight: 500;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: red;
            color: white;
            transition: background-color 0.2s ease;
        }
                .btn-medium {
            font-size: 20px;      /* Clear, readable font scale */
            padding: 10px 20px;  /* 10px top/bottom, 20px left/right */
        }
                .fart {
                    color:black;
                }

    </style>

    <h1 style="background-color: #0400ff; padding: 5; border: 2px solid #333333; border-radius: 20px; text-align:center">Recipe Book</h1>

    <div class="vertical-links" style="text-align:center; border-radius: 20px">
    <a href="https://google.com" style="" class="btn btn-medium">Sourdough Chocolate Cookies</a>
    <br><br>
    <a href="https://reddit.com" style="" class="btn btn-medium">Scones</a>
    <br><br>
    <a href="reddit.com" style="" class="btn btn-medium">Brazi Bites</a>
</html>
