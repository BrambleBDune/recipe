<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Family Recipe Book</title>
    <link rel="stylesheet" href="style.css">
</head>

<style>
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background-color: #ffaa00;
    color: #1f1d1d;
    line-height: 1.6;
    padding: 20px;
    
}

header {
    text-align: center;
    margin-bottom: 30px;
    background-color: #d96b43;
    color: white;
    padding: 20px;
    border-radius: 8px;
} 
 .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    font-weight: 500;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background-color: red;
    color: white;
    transition: background-color 0.2s ease;
    
}
 .btn-medium {
    font-size: 20px;      /* Clear, readable font scale */
    padding: 10px 20px;  /* 10px top/bottom, 20px left/right */
 }
    
  .padded-button {
    /* 12px top/bottom spacing, 24px left/right spacing */
    padding: 10px 100px; 
    font-size: 20px;
  } 

</style>

<body>

    <header>
        <h1>Desserts</h1>
        <p></p>
    </header>

    <main class="recipe-container">
        <!-- Recipe Card Example -->
<div class=" vertical-links" style="text-align:center;  font-size: 30px;" >
        <ul id="myList">
            <li><a href="https://recipe.25398387.xyz/pages/lemmon-bars.html" class="zoop">Lemon Bars </a></li>
    
        </ul>
   
</div>
    

    <footer>
<a href="http://recipe.25398387.xyz/index.html" class="homebutt">HOME</a>
    </footer>

        <script>
  // 1. Get the list element and all of its <li> children
  const list = document.getElementById('myList');
  const items = Array.from(list.getElementsByTagName('li'));

  // 2. Sort the elements alphabetically based on their text content
  items.sort((a, b) => a.textContent.localeCompare(b.textContent));

  // 3. Clear the current list contents
  list.innerHTML = '';

  // 4. Append the sorted items back into the list
  items.forEach(item => list.appendChild(item));
</script>

        

</body>
</html>
