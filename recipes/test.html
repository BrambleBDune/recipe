<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Shared Recipe Box</title>
  <style>
    :root {
      --primary: #e67e22;
      --bg: #f9f9f9;
      --card-bg: #ffffff;
      --text: #2c3e50;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1, h2, h3 {
      color: var(--primary);
    }
    .recipe-list-container, .admin-box {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 30px;
    }
    .admin-box {
      border-left: 5px solid var(--primary);
    }
    .btn {
      display: inline-block;
      background-color: var(--primary);
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 4px;
      font-weight: bold;
      text-align: center;
    }
    .btn:hover {
      background-color: #d35400;
    }
    .recipe-card {
      border-bottom: 2px solid #eee;
      padding-bottom: 20px;
      margin-bottom: 20px;
    }
    .recipe-card:last-child {
      border-bottom: none;
    }
    ul, ol {
      padding-left: 20px;
    }
    .loading {
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🍳 Shared Recipe Box</h1>
    
    <!-- 1. ADMIN SUBMISSION LINK -->
    <div class="admin-box">
      <h2>Want to add a recipe?</h2>
      <p>Only the website owner can add recipes. Click the button below to open GitHub, type your recipe, and submit it!</p>
      <!-- This link will be dynamically generated by JS -->
      <a href="#" id="submitLink" target="_blank" class="btn">➕ Write New Recipe</a>
    </div>

    <!-- 2. PUBLIC RECIPE FEED -->
    <div class="recipe-list-container">
      <h2>All Recipes</h2>
      <div id="recipeFeed" class="loading">Loading delicious recipes from GitHub...</div>
    </div>
  </div>

  <!-- 3. THE LOGIC -->
  <script>
    // ==========================================
    // CONFIGURATION: CHANGE THESE TO YOUR DETAILS
    // ==========================================
    const GITHUB_USERNAME = "YOUR_GITHUB_USERNAME"; 
    const REPO_NAME = "YOUR_REPOSITORY_NAME";
    // ==========================================

    const recipeFeed = document.getElementById('recipeFeed');
    const submitLink = document.getElementById('submitLink');

    // Set up the dynamic button link to open GitHub Issues with a template
    const templateBody = encodeURIComponent("### Ingredients\n- \n- \n\n### Instructions\n1. \n2. ");
    submitLink.href = `https://github.com{GITHUB_USERNAME}/${REPO_NAME}/issues/new?title=Recipe:+[Name+Here]&body=${templateBody}`;

    // Load recipes automatically on page load
    document.addEventListener('DOMContentLoaded', fetchRecipesFromGitHub);

    async function fetchRecipesFromGitHub() {
      try {
        // Fetch open issues from your public repository
        const response = await fetch(`https://github.com{GITHUB_USERNAME}/${REPO_NAME}/issues?state=open`);
        
        if (!response.ok) {
          throw new Error("Could not fetch data from GitHub.");
        }

        const issues = await response.json();
        
        // Filter out issues that don't start with "Recipe:" to keep it clean
        const recipes = issues.filter(issue => issue.title.toLowerCase().startsWith('recipe:'));

        if (recipes.length === 0) {
          recipeFeed.innerHTML = '<p style="color: #888;">No public recipes found yet.</p>';
          return;
        }

        // Render the recipes using markdown-to-html conversion for the body
        recipeFeed.innerHTML = recipes.map(issue => {
          // Strip "Recipe: " from the title
          const displayTitle = issue.title.replace(/^recipe:\s*/i, '');
          
          // Basic parser to turn GitHub Markdown list blocks into HTML items
          const htmlBody = parseMarkdown(issue.body);

          return `
            <div class="recipe-card">
              <h3>${escapeHtml(displayTitle)}</h3>
              <div>${htmlBody}</div>
              <small style="color:#aaa;">Added by ${escapeHtml(issue.user.login)}</small>
            </div>
          `;
        }).join('');

      } catch (error) {
        recipeFeed.innerHTML = `<p style="color: red;">Error loading recipes: ${error.message}</p>`;
      }
    }

    // Simple helper to parse standard GitHub line breaks and lists into HTML
    function parseMarkdown(text) {
      if (!text) return '';
      let html = escapeHtml(text);
      
      // Convert headers (### Ingredients)
      html = html.replace(/^### (.*\$)/gim, '<h4>\$1</h4>');
      // Convert bullet points (- item)
      html = html.replace(/^\s*-\s*(.*\$)/gim, '<li>\$1</li>');
      // Wrap stray list items in standard paragraphs for spacing if needed
      html = html.replace(/\n/g, '<br>');
      
      return html;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>

</body>
</html>
