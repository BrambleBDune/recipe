<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Recipe Dashboard</title>
  <style>
    :root {
      --primary: #e67e22;
      --bg: #f9f9f9;
      --card-bg: #ffffff;
      --text: #2c3e50;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1, h2, h3 {
      color: var(--primary);
    }
    /* Form Styles */
    .recipe-form-container, .recipe-list-container {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: inherit;
    }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      margin-top: 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
    }
    button:hover {
      background-color: #d35400;
    }
    /* Recipe Feed Styles */
    .recipe-card {
      border-bottom: 2px solid #eee;
      padding-bottom: 20px;
      margin-bottom: 20px;
    }
    .recipe-card:last-child {
      border-bottom: none;
    }
    ul, ol {
      padding-left: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🍳 My Personal Recipe Box</h1>
    
    <!-- 1. THE INPUT UI -->
    <div class="recipe-form-container">
      <h2>Add a New Recipe</h2>
      <form id="recipeForm">
        <label for="recipeTitle">Recipe Name:</label>
        <input type="text" id="recipeTitle" required placeholder="e.g., Grandma's Chocolate Chip Cookies">

        <label for="recipeIngredients">Ingredients (one per line):</label>
        <textarea id="recipeIngredients" rows="5" required placeholder="2 cups flour&#10;1 cup butter&#10;1 cup chocolate chips"></textarea>

        <label for="recipeSteps">Instructions (one per line / step):</label>
        <textarea id="recipeSteps" rows="5" required placeholder="Preheat oven to 350°F.&#10;Mix butter and sugar.&#10;Bake for 10 minutes."></textarea>

        <button type="submit">Add to My Recipe Box</button>
      </form>
    </div>

    <!-- 2. THE DISPLAY UI -->
    <div class="recipe-list-container">
      <h2>Your Saved Recipes</h2>
      <div id="recipeFeed">
        <!-- JavaScript will inject recipes here -->
      </div>
    </div>
  </div>

  <!-- 3. THE LOGIC -->
  <script>
    const recipeForm = document.getElementById('recipeForm');
    const recipeFeed = document.getElementById('recipeFeed');

    // Load and display recipes when the page opens
    document.addEventListener('DOMContentLoaded', displayRecipes);

    // Handle form submission
    recipeForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const title = document.getElementById('recipeTitle').value;
      // Split text by lines and filter out empty lines
      const ingredients = document.getElementById('recipeIngredients').value.split('\n').filter(line => line.trim() !== '');
      const steps = document.getElementById('recipeSteps').value.split('\n').filter(line => line.trim() !== '');

      const newRecipe = {
        id: Date.now(),
        title: title,
        ingredients: ingredients,
        steps: steps
      };

      // Save to localStorage
      const existingRecipes = JSON.parse(localStorage.getItem('myRecipes') || '[]');
      existingRecipes.unshift(newRecipe); // Add new recipe to the top
      localStorage.setItem('myRecipes', JSON.stringify(existingRecipes));

      // Reset form and refresh display
      recipeForm.reset();
      displayRecipes();
    });

    // Function to render recipes onto the page
    function displayRecipes() {
      const recipes = JSON.parse(localStorage.getItem('myRecipes') || '[]');
      
      if (recipes.length === 0) {
        recipeFeed.innerHTML = '<p style="color: #888;">No recipes saved yet. Add one above!</p>';
        return;
      }

      recipeFeed.innerHTML = recipes.map(recipe => `
        <div class="recipe-card">
          <h3>${escapeHtml(recipe.title)}</h3>
          
          <h4>Ingredients</h4>
          <ul>
            ${recipe.ingredients.map(ing => `<li>\${escapeHtml(ing)}</li>`).join('')}
          </ul>
          
          <h4>Instructions</h4>
          <ol>
            ${recipe.steps.map(step => `<li>\${escapeHtml(step)}</li>`).join('')}
          </ol>
        </div>
      `).join('');
    }

    // Helper function to prevent malicious code injection (XSS protection)
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>

</body>
</html>
